name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Keep the same debug signing key between GitHub runner builds.
      # This lets users install future APKs as updates without uninstalling
      # the app or losing its local settings/accessibility setup.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: holdgrip-debug-keystore-v1

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HoldGrip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
